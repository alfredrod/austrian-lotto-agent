[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "austrian-lotto-agent"
version = "0.1.0"
description = "Statistical analysis bot for Austrian Lotto 6 aus 45 (research tool - cannot predict draws)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0", "beautifulsoup4>=4.11.0", "pandas>=1.5.0", "numpy>=1.23.0", "scipy>=1.9.0",
    "scikit-learn>=1.1.0", "pytz>=2022.1", "schedule>=1.1.0", "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lotto-agent = "interface:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["backtester", "data_collector", "database", "interface", "models", "scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
